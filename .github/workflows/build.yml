name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            artifact-name: macos-build
            build-args: '--target universal-apple-darwin'
            rust-targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact-name: linux-build
            build-args: ''
            rust-targets: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            artifact-name: windows-build
            build-args: ''
            rust-targets: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build frontend
        run: npm run build

      - name: Build Tauri
        run: npx tauri build ${{ matrix.build-args }}

      - name: Find artifacts
        id: artifacts
        shell: bash
        run: |
          echo "Looking for built artifacts..."
          find src-tauri/target -name "*.dmg" -o -name "*.AppImage" -o -name "*.deb" -o -name "*.msi" -o -name "*.exe" -o -name "*.app" 2>/dev/null | head -20

          # Collect artifact paths
          ARTIFACTS=""
          for ext in dmg AppImage deb msi; do
            for f in $(find src-tauri/target -name "*.$ext" 2>/dev/null); do
              ARTIFACTS="$ARTIFACTS$f\n"
            done
          done
          # Windows exe (only the NSIS installer, not the binary itself)
          for f in $(find src-tauri/target -path "*/nsis/*.exe" 2>/dev/null); do
            ARTIFACTS="$ARTIFACTS$f\n"
          done
          echo -e "$ARTIFACTS"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/nsis/*.exe
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -30

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: 'Ghost Chat ${{ github.ref_name }}'
          body: |
            End-to-end encrypted desktop messenger. PGP over Nostr.
            No accounts, no servers, no logs. Built with Tauri + Rust.

            **Downloads:**
            - macOS: `.dmg` (Universal — Intel + Apple Silicon)
            - Linux: `.AppImage` or `.deb`
            - Windows: `.msi` or `.exe`
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
